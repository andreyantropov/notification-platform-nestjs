# --- Templates ---
x-common-service: &common-service
  restart: unless-stopped
  networks:
    - notification-platform-net
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M
      reservations:
        memory: 128M

services:
  # --- Infrastructure: RabbitMQ ---
  rabbitmq:
    <<: *common-service
    image: rabbitmq:4.2.5-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dev_user
      RABBITMQ_DEFAULT_PASS: dev_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq-init:
    image: voxsoft/kube-helm-multitool:v1.35.3-v3.20.1
    container_name: rabbitmq-init
    networks:
      - notification-platform-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    command: sh -c "sleep 2 && curl -s -u dev_user:dev_password -X POST http://rabbitmq:15672/api/definitions -H 'Content-Type:application/json' -d @/etc/rabbitmq/definitions.json && sleep 2"

  # --- Service: Receive ---
  receive-service:
    <<: *common-service
    image: receive-service:${SERVICE_VERSION:-dev}
    container_name: receive-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: receive-service
    env_file:
      - services/receive-service/.env.development
    environment:
      - BROKER_URL=amqp://dev_user:dev_password@rabbitmq:5672
    ports:
      - '3001:${PORT:-3001}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${PORT:-3001}/health/live').then(r => { if (!r.ok) throw r; process.exit(0); }).catch(() => process.exit(1))",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully

  # --- Service: Delivery ---
  delivery-service:
    <<: *common-service
    image: delivery-service:${SERVICE_VERSION:-dev}
    container_name: delivery-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: delivery-service
    env_file:
      - services/delivery-service/.env.development
    environment:
      - BROKER_URL=amqp://dev_user:dev_password@rabbitmq:5672
    ports:
      - '3002:${PORT:-3002}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${PORT:-3002}/health/live').then(r => { if (!r.ok) throw r; process.exit(0); }).catch(() => process.exit(1))",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully

volumes:
  rabbitmq-data:

networks:
  notification-platform-net:
    name: notification-platform-net
    driver: bridge
